name: Web Component Tests

# Runs the src/AddressBook.Web.Tests bUnit/xUnit v3 suite. The tests render components in memory,
# so the job needs only the .NET SDK: no database, no Node, no browser. Fires on pull requests and
# on pushes to main when the code under test or the build inputs change, and on demand.
on:
  pull_request:
    paths:
      - src/AddressBook.Web/**
      - src/AddressBook.Web.Tests/**
      - src/AddressBook.Contracts/**
      - src/Directory.*.props
      - global.json
      - .config/dotnet-tools.json
      - .github/workflows/web-tests.yml
  push:
    branches: [main]
    paths:
      - src/AddressBook.Web/**
      - src/AddressBook.Web.Tests/**
      - src/AddressBook.Contracts/**
      - src/Directory.*.props
      - global.json
      - .config/dotnet-tools.json
      - .github/workflows/web-tests.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces an unfinished one on the same ref, except on main, where every merge is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-tests:
    name: Web component tests (src/AddressBook.Web.Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # dorny/test-reporter creates the "Web component test results" check run.
      checks: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: src/**/packages.lock.json

      - name: Restore
        run: dotnet restore src/AddressBook.Web.Tests --locked-mode

      - name: Build
        run: dotnet build src/AddressBook.Web.Tests -c Release --no-restore

      - name: Test
        # --report-xunit-trx is the xUnit v3 TRX reporter; --coverage comes from
        # Microsoft.Testing.Extensions.CodeCoverage. Both write to TestResults/.
        run: >
          dotnet test --project src/AddressBook.Web.Tests -c Release --no-build
          --results-directory TestResults
          -- --report-xunit-trx --coverage --coverage-output-format cobertura

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Web component test results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          # With the default (true) the action writes only the job summary and creates no check run.
          use-actions-summary: 'false'
          list-suites: failed
          list-tests: failed

      - name: Build coverage report
        # ReportGenerator (version pinned in .config/dotnet-tools.json) turns the Cobertura file into
        # an HTML report and a markdown summary limited to the AddressBook.Web assembly under test.
        # It writes the reports first and then exits non-zero when line or branch coverage is below
        # its minimum threshold, so the summary is published even for a failing run.
        run: |
          dotnet tool restore
          status=0
          dotnet tool run reportgenerator \
            "-reports:TestResults/**/*.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:HtmlInline_AzurePipelines;MarkdownSummaryGithub" \
            "-assemblyfilters:+AddressBook.Web" \
            "minimumCoverageThresholds:lineCoverage=85" \
            "minimumCoverageThresholds:branchCoverage=70" || status=$?
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Coverage of AddressBook.Web is below the minimum (lines 85 %, branches 70 %) or the report failed; see the coverage summary of this run."
          fi
          exit "$status"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: web-tests-coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Upload test results and coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: web-tests-results
          path: TestResults/
          retention-days: 30
